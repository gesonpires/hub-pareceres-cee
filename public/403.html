<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acesso Negado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 16px;
        }
        
        p {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
        }
        
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <div class="error-code">403</div>
        <h1>Acesso Negado</h1>
        <p>
            Você não tem permissão para acessar este recurso. 
            Seu perfil atual não possui as permissões necessárias para realizar esta ação.
        </p>
        <p>
            <strong>Perfil necessário:</strong> <span id="perfilRequerido">Edição</span><br>
            <strong>Seu perfil:</strong> <span id="perfilAtual">Consulta</span>
        </p>
        <a href="/" class="btn">Voltar para o início</a>
    </div>
    
    <script>
        // Se houver informações de erro na URL ou localStorage, exibir
        const urlParams = new URLSearchParams(window.location.search);
        const perfilRequerido = urlParams.get('perfilRequerido') || 'Edição';
        const perfilAtual = urlParams.get('perfilAtual') || 'Consulta';
        
        document.getElementById('perfilRequerido').textContent = perfilRequerido;
        document.getElementById('perfilAtual').textContent = perfilAtual;
    </script>
</body>
</html>
