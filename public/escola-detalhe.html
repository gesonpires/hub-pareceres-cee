<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe da Escola - Hub Pareceres CEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #eee;
        }
        
        h1 {
            color: #333;
            margin-bottom: 8px;
        }
        
        .escola-info {
            margin-bottom: 32px;
        }
        
        .info-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            margin-bottom: 12px;
            padding: 8px 0;
        }
        
        .info-label {
            font-weight: 600;
            color: #666;
        }
        
        .info-value {
            color: #333;
        }
        
        .section-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .btn-edit {
            background: #ffc107;
            color: #000;
        }
        
        .btn-edit:hover {
            background: #e0a800;
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        
        .btn-delete:hover {
            background: #c82333;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: #f9f9f9;
            font-weight: 600;
            color: #333;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .badge-vigente {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-expirado {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-revogado {
            background: #f8d7da;
            color: #721c24;
        }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .required-field {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 id="escola-nome">Carregando...</h1>
                <a href="/escolas.html" class="btn btn-secondary">← Voltar para Escolas</a>
            </div>
            <button class="btn btn-primary" onclick="abrirFormularioAto()">+ Novo Ato Autorizativo</button>
        </div>
        
        <div id="error-message" class="error" style="display: none;"></div>
        
        <div class="escola-info" id="escola-info" style="display: none;">
            <div class="info-row">
                <div class="info-label">Código INEP:</div>
                <div class="info-value" id="escola-inep">-</div>
            </div>
            <div class="info-row">
                <div class="info-label">CNPJ:</div>
                <div class="info-value" id="escola-cnpj">-</div>
            </div>
            <div class="info-row">
                <div class="info-label">Município:</div>
                <div class="info-value" id="escola-municipio">-</div>
            </div>
            <div class="info-row">
                <div class="info-label">Rede de Ensino:</div>
                <div class="info-value" id="escola-rede">-</div>
            </div>
            <div class="info-row">
                <div class="info-label">Situação:</div>
                <div class="info-value" id="escola-situacao">-</div>
            </div>
        </div>
        
        <div class="section-title">Atos Autorizativos</div>
        
        <div id="loading" class="loading">Carregando atos...</div>
        <div id="atos-container" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Número</th>
                        <th>Ano</th>
                        <th>Data Publicação</th>
                        <th>Órgão Emissor</th>
                        <th>Status Vigência</th>
                        <th>Observações</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="atos-tbody">
                </tbody>
            </table>
        </div>
        <div id="empty" class="empty" style="display: none;">
            Nenhum ato autorizativo cadastrado para esta escola.
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3000/api';
        let token = localStorage.getItem('token');
        let escolaId = null;
        
        if (!token) {
            window.location.href = '/login.html';
        }
        
        // Obter escolaId da URL
        const urlParams = new URLSearchParams(window.location.search);
        escolaId = urlParams.get('id');
        
        if (!escolaId) {
            window.location.href = '/escolas.html';
        }
        
        async function carregarEscola() {
            try {
                const response = await fetch(`${API_URL}/escolas/${escolaId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/login.html';
                    return;
                }
                
                const escola = await response.json();
                
                document.getElementById('escola-nome').textContent = escola.nomeOficial;
                document.getElementById('escola-inep').textContent = escola.codigoIneq || '-';
                document.getElementById('escola-cnpj').textContent = escola.cnpj || '-';
                document.getElementById('escola-municipio').textContent = escola.municipio || '-';
                document.getElementById('escola-rede').textContent = escola.redeEnsino || '-';
                document.getElementById('escola-situacao').textContent = escola.situacao;
                document.getElementById('escola-info').style.display = 'block';
            } catch (error) {
                mostrarErro('Erro ao carregar escola: ' + error.message);
            }
        }
        
        async function carregarAtos() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('atos-container').style.display = 'none';
                document.getElementById('empty').style.display = 'none';
                document.getElementById('error-message').style.display = 'none';
                
                const response = await fetch(`${API_URL}/escolas/${escolaId}/atos`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/login.html';
                    return;
                }
                
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                if (data.atos && data.atos.length > 0) {
                    document.getElementById('atos-container').style.display = 'block';
                    renderizarAtos(data.atos);
                } else {
                    document.getElementById('empty').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                mostrarErro('Erro ao carregar atos: ' + error.message);
            }
        }
        
        function renderizarAtos(atos) {
            const tbody = document.getElementById('atos-tbody');
            tbody.innerHTML = '';
            
            atos.forEach(ato => {
                const tr = document.createElement('tr');
                const dataPub = new Date(ato.dataPublicacao).toLocaleDateString('pt-BR');
                
                tr.innerHTML = `
                    <td>${ato.tipoAto}</td>
                    <td>${ato.numeroAto}</td>
                    <td>${ato.anoAto || '-'}</td>
                    <td>${dataPub}</td>
                    <td>${ato.orgaoEmissor}</td>
                    <td><span class="badge badge-${ato.statusVigencia}">${ato.statusVigencia}</span></td>
                    <td>${ato.observacoes ? (ato.observacoes.length > 50 ? ato.observacoes.substring(0, 50) + '...' : ato.observacoes) : '-'}</td>
                    <td class="actions">
                        <button class="btn btn-sm btn-edit" onclick="editarAto('${ato.id}')">Editar</button>
                        <button class="btn btn-sm btn-delete" onclick="excluirAto('${ato.id}')">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function abrirFormularioAto(id = null) {
            window.location.href = `/ato-form.html?escolaId=${escolaId}${id ? '&id=' + id : ''}`;
        }
        
        function editarAto(id) {
            abrirFormularioAto(id);
        }
        
        async function excluirAto(id) {
            if (!confirm('Tem certeza que deseja excluir este ato autorizativo?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/atos/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = '/login.html';
                    return;
                }
                
                if (response.status === 403) {
                    mostrarErro('Você não tem permissão para excluir atos.');
                    return;
                }
                
                if (response.ok) {
                    carregarAtos();
                } else {
                    const data = await response.json();
                    mostrarErro(data.error || 'Erro ao excluir ato');
                }
            } catch (error) {
                mostrarErro('Erro ao excluir ato: ' + error.message);
            }
        }
        
        function mostrarErro(mensagem) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = mensagem;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Carregar dados ao carregar a página
        carregarEscola();
        carregarAtos();
    </script>
</body>
</html>
